[tool.poetry]
name = "LeagueSkinManagerVN"
version = "0.3.0"
description = "A tool for managing League of Legends custom skins"
authors = ["Quinntana <archimedesstar@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"
packages = [{ include = "league_skin_manager", from = "src" }]

[tool.poetry.scripts]
league-skin-manager = "league_skin_manager.__main__:main"
league-skin-manager-uninstall = "league_skin_manager.uninstall:main"
league-skin-manager-setup = "league_skin_manager.installer:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = "^2.31.0"
pystray = "^0.19.4"
psutil = "^5.9.8"
Pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.15.0"
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
ruff = "^0.15.0"
mypy = "^1.20.0"
types-requests = "^2.32.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PIL.*", "psutil.*", "pystray.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=league_skin_manager --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "src/league_skin_manager/__main__.py",
    "src/league_skin_manager/main.py",
    "src/league_skin_manager/uninstall.py",
]
